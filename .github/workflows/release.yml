name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify and build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run release checks and tests
        run: npm run check && npm test

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Decode Android signing keystore
        shell: bash
        env:
          FIN_ANDROID_KEYSTORE_BASE64: ${{ secrets.FIN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FIN_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$FIN_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fin-release.jks"

      - name: Build signed APK and Play Store bundle
        run: gradle clean assembleRelease bundleRelease --stacktrace
        env:
          FIN_API_BASE_URL: ${{ vars.FIN_API_BASE_URL }}
          FIN_RELEASE_STORE_FILE: ${{ runner.temp }}/fin-release.jks
          FIN_RELEASE_STORE_PASSWORD: ${{ secrets.FIN_RELEASE_STORE_PASSWORD }}
          FIN_RELEASE_KEY_ALIAS: ${{ secrets.FIN_RELEASE_KEY_ALIAS }}
          FIN_RELEASE_KEY_PASSWORD: ${{ secrets.FIN_RELEASE_KEY_PASSWORD }}

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: FIN-android-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
